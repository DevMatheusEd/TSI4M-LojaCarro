<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>CRUD Carro</title>
</head>
<body>

<a href="/usuario/logout">Sair</a>

<h1>Cadastrar carro</h1>
<form action="/carro/salvar" method="POST">
    Modelo: <input type="text" name="modelo" required><br>
    Preço: <input type="number" step="0.01" name="preco" required><br>
    Ano: <input type="number" name="ano" required><br>
    <button type="submit">Salvar</button>
</form>

<h1>Listar carros</h1>
<a href="/carro/listarCarros" target="_blank" rel="noopener noreferrer">Listar Carros</a>

<h1>Buscar carro por ID</h1>
<form action="/carro/buscarPorId" method="GET" target="_blank" rel="noopener noreferrer">
    ID: <input type="number" name="id" required>
    <button type="submit">Buscar</button>
</form>

<h1>Atualizar carro</h1>
<form action="/carro/atualizar" method="POST">
    ID: <input type="number" name="id" required><br>
    Modelo: <input type="text" name="modelo" required><br>
    Preço: <input type="number" step="0.01" name="preco" required><br>
    Ano: <input type="number" name="ano" required><br>
    <button type="submit">Atualizar</button>
</form>

<h1>Deletar carro</h1>
<form action="/carro/deletar" method="POST"
      onsubmit="return confirm('Tem certeza que deseja deletar o carro com este ID?');">
    ID: <input type="number" name="id" required>
    <button type="submit">Deletar</button>
</form>

<script>
    if (new URLSearchParams(window.location.search).get("deletado") === "1") {
        alert("Carro deletado com sucesso!");
        window.history.replaceState({}, "", "/carro.html");
    }
</script>

</body>
</html>
